[project]
name = "blockmap"
version = "0.1.0"
description = "Turn any git repo/branch into an interactive map: data flow between scripts, run order, and a block-by-block diagram of every file."
readme = "README.md"
license = "MIT"
authors = [
    { name = "akshittyagi777", email = "174667884+akshittyagi777@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["code visualization", "architecture", "documentation", "static analysis", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Environment :: Console",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.11.0",
]

[project.scripts]
blockmap = "blockmap.cli:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "FURB", "BLE"]
ignore = ["SIM108", "RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
